    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(ellipse 70% 50% at 30% 15%, rgba(244, 114, 182, 0.22) 0%, transparent 55%),
                radial-gradient(ellipse 60% 45% at 85% 85%, rgba(251, 146, 60, 0.15) 0%, transparent 50%),
                linear-gradient(165deg, #1c0a14 0%, #120810 50%, #0a0608 100%);
            color: #fff;
            padding: 40px 16px;
            overflow-x: hidden;
        }

        .wrap {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            width: 100%;
            padding: 28px 24px 26px;
            border-radius: 32px;
            background: rgba(40, 16, 28, 0.72);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(251, 182, 206, 0.3);
            box-shadow:
                0 0 40px rgba(244, 114, 182, 0.15),
                0 20px 50px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 999px;
            background: rgba(244, 114, 182, 0.15);
            border: 1px solid rgba(251, 182, 206, 0.35);
            color: #fbcfe8;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 22px;
        }

        .profile-wrap {
            position: relative;
            width: 118px;
            height: 118px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-spinner {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(#fbcfe8, #f472b6, #fb923c, #f472b6, #fbcfe8);
            animation: spinBorder 2.4s linear infinite;
            box-shadow: 0 0 22px rgba(244, 114, 182, 0.4);
        }

        .profile-spinner::after {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: 50%;
            background: #1c0a14;
        }

        .profile {
            width: 104px;
            height: 104px;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 2;
            border: 3px solid #1c0a14;
        }

        @keyframes spinBorder {
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.4px;
            margin-bottom: 14px;
        }

        .content {
            font-size: 13px;
            font-weight: 500;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.88);
            margin-bottom: 16px;
        }

        .content .line2 {
            display: block;
            margin-top: 6px;
            color: #fbcfe8;
            font-weight: 600;
        }

        .points {
            list-style: none;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 0 0 22px;
            padding: 0 4px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.88);
        }

        .points li {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .points i {
            color: #f472b6;
            margin-top: 3px;
            font-size: 12px;
        }

        .timer {
            font-size: 14px;
            font-weight: 600;
            margin-top: 18px;
            color: #fff;
        }

        .timer span {
            color: #f9a8d4;
            font-weight: 800;
        }

        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            overflow: hidden;
            background: linear-gradient(180deg, #f472b6 0%, #db2777 100%);
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.3px;
            box-shadow: 0 0 24px rgba(244, 114, 182, 0.45);
            animation: jump 1.35s ease-in-out infinite;
            z-index: 1;
        }

        .btn .tg-icon {
            color: #fff;
            font-size: 18px;
        }

        @keyframes jump {
            0%, 55%, 100% { transform: translateY(0); }
            20% { transform: translateY(-14px); }
            35% { transform: translateY(0); }
            45% { transform: translateY(-7px); }
        }

        @media (max-width: 420px) {
            .card {
                padding: 24px 18px 22px;
            }

            h1 {
                font-size: 19px;
            }

            .btn {
                font-size: 13px;
                padding: 13px 14px;
            }
        }
    </style>

</head>
